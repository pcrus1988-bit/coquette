<!doctype html>
<html lang="el">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f4f0ea" />
    <title>COQUETTE Studio</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="login-page">
    <main class="login-shell" aria-labelledby="login-title">
      <section class="login-center">
        <h1 id="login-title" class="sr-only">COQUETTE Studio sign in</h1>
        <img
          class="login-logo"
          src="/assets/coquette-logo-transparent.png"
          alt="COQUETTE Concept Store"
        />

        <form class="login-form" id="login-form" novalidate>
          <label class="line-field">
            <span>Email</span>
            <input
              id="email"
              name="email"
              type="email"
              inputmode="email"
              autocomplete="username"
              required
              aria-describedby="login-error"
            />
          </label>

          <label class="line-field password-field">
            <span>Password</span>
            <span class="password-input-wrap">
              <input
                id="password"
                name="password"
                type="password"
                autocomplete="current-password"
                required
                aria-describedby="login-error"
              />
              <button class="reveal-password" type="button" id="reveal-password" aria-label="Show password">
                Show
              </button>
            </span>
          </label>

          <p class="form-error" id="login-error" role="alert" aria-live="polite"></p>

          <button class="primary-action" type="submit" id="login-button">
            Enter Studio
          </button>

          <button class="text-action" type="button">Forgot password?</button>
        </form>
      </section>

      <footer class="login-quote" aria-label="Quotation">
        <p>«Ένα κορίτσι πρέπει να είναι δύο πράγματα: όποια θέλει και ό,τι θέλει.»</p>
        <span class="signature">Coco Chanel</span>
      </footer>
    </main>

    <script src="/app.js" defer></script>
  </body>
</html>
