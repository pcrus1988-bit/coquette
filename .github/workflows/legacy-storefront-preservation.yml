name: COQUETTE Legacy Storefront Preservation

on:
  push:
    branches:
      - "phase4/emergency-storefront-capture"
    paths:
      - "apps/backend/src/reconstruction/**"
      - "apps/backend/src/scripts/capture-legacy-storefront.ts"
      - "apps/backend/package.json"
      - ".github/workflows/legacy-storefront-preservation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coquette-legacy-preservation
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify browser runtime
        shell: bash
        run: |
          command -v google-chrome || command -v google-chrome-stable || command -v chromium
          command -v xvfb-run

      - name: Capture public legacy storefront
        env:
          COQUETTE_CAPTURE_BASE_URL: https://coquetteconcept.gr/
          COQUETTE_CAPTURE_ID: emergency-${{ github.run_id }}-${{ github.run_attempt }}
          COQUETTE_CAPTURE_DIR: ${{ runner.temp }}/coquette-legacy-capture
          COQUETTE_CAPTURE_MAX_PAGES: "5000"
          COQUETTE_CAPTURE_DELAY_MS: "125"
          COQUETTE_CAPTURE_DOWNLOAD_MEDIA: "true"
          COQUETTE_CAPTURE_MEDIA_CONCURRENCY: "6"
          COQUETTE_CAPTURE_RESPECT_ROBOTS: "true"
          COQUETTE_CAPTURE_BROWSER: "true"
          COQUETTE_CAPTURE_BROWSER_MODE: headed
          COQUETTE_CAPTURE_CHALLENGE_TIMEOUT_MS: "30000"
        run: pnpm --filter @coquette/backend storefront:capture

      - name: Publish capture summary
        if: always()
        shell: bash
        run: |
          if [ -f "${RUNNER_TEMP}/coquette-legacy-capture/manifest.json" ]; then
            echo '## Legacy storefront preservation manifest' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat "${RUNNER_TEMP}/coquette-legacy-capture/manifest.json" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload preservation artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coquette-legacy-preservation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/coquette-legacy-capture/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
