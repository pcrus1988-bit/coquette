name: COQUETTE Studio Archive CI

on:
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"
    paths:
      - "apps/studio/new-piece-archive.js"
      - "apps/studio/new-piece-archive.css"
      - "apps/studio/public/new-piece-archive.js"
      - "apps/studio/public/new-piece-archive.css"
      - "apps/studio/studio.html"
      - "apps/studio/public/studio.html"
      - "apps/studio/api/studio/archive-*.js"
      - "apps/studio/api/studio/drafts.js"
      - "apps/studio/api/studio/product-draft-update.js"
      - "apps/backend/src/api/middlewares.ts"
      - "apps/backend/src/api/admin/studio/archive/**"
      - "apps/backend/src/lib/studio-archive*.ts"
      - "apps/backend/src/lib/studio-lifecycle.ts"
      - "apps/backend/src/workflows/apply-studio-archive.ts"
      - "apps/backend/src/scripts/studio-archive-contract.ts"
      - ".github/workflows/studio-archive.yml"
  pull_request:
    branches:
      - main
    paths:
      - "apps/studio/new-piece-archive.js"
      - "apps/studio/new-piece-archive.css"
      - "apps/studio/public/new-piece-archive.js"
      - "apps/studio/public/new-piece-archive.css"
      - "apps/studio/studio.html"
      - "apps/studio/public/studio.html"
      - "apps/studio/api/studio/archive-*.js"
      - "apps/studio/api/studio/drafts.js"
      - "apps/studio/api/studio/product-draft-update.js"
      - "apps/backend/src/api/middlewares.ts"
      - "apps/backend/src/api/admin/studio/archive/**"
      - "apps/backend/src/lib/studio-archive*.ts"
      - "apps/backend/src/lib/studio-lifecycle.ts"
      - "apps/backend/src/workflows/apply-studio-archive.ts"
      - "apps/backend/src/scripts/studio-archive-contract.ts"
      - ".github/workflows/studio-archive.yml"

permissions:
  contents: read

concurrency:
  group: coquette-studio-archive-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0

      - name: Validate Studio JavaScript syntax
        run: |
          node --check apps/studio/new-piece-archive.js
          node --check apps/studio/public/new-piece-archive.js
          node --check apps/studio/api/studio/archive-state.js
          node --check apps/studio/api/studio/archive-plan.js
          node --check apps/studio/api/studio/archive-apply.js
          node --check apps/studio/api/studio/drafts.js
          node --check apps/studio/api/studio/product-draft-update.js

      - name: Enforce production asset parity
        run: |
          set -euo pipefail
          cmp -s apps/studio/new-piece-archive.js apps/studio/public/new-piece-archive.js
          cmp -s apps/studio/new-piece-archive.css apps/studio/public/new-piece-archive.css
          cmp -s apps/studio/studio.html apps/studio/public/studio.html
          grep -q '/new-piece-archive.css' apps/studio/studio.html
          grep -q '/new-piece-archive.js' apps/studio/studio.html

      - name: Enforce archive policy boundaries
        run: |
          set -euo pipefail
          domain=apps/backend/src/lib/studio-archive.ts
          policy=apps/backend/src/lib/studio-archive-policy.ts
          workflow=apps/backend/src/workflows/apply-studio-archive.ts
          middleware=apps/backend/src/api/middlewares.ts
          lifecycle=apps/backend/src/lib/studio-lifecycle.ts
          contract=apps/backend/src/scripts/studio-archive-contract.ts
          client=apps/studio/new-piece-archive.js

          grep -q 'STUDIO_ARCHIVE_ACTIONS = \["archive", "restore"\]' "$domain"
          grep -q 'createHash("sha256")' "$domain"
          grep -q 'stale_archive_plan' "$domain"
          grep -q 'archived_visibility_violation' "$domain"
          grep -q 'target_status: "draft"' "$domain"
          grep -q 'sales_channels: true' "$domain"
          grep -q 'variants: true' "$domain"
          grep -q 'pricing: true' "$domain"
          grep -q 'inventory: true' "$domain"
          grep -q 'media: true' "$domain"
          grep -q 'placement: true' "$domain"

          grep -q 'coquette_studio_archived' "$policy"
          grep -q 'coquette_studio_archive_previous_status' "$policy"
          grep -q 'updateProductsWorkflow' "$workflow"
          grep -q 'status: data.target_status' "$workflow"
          grep -q 'metadata: data.metadata' "$workflow"

          grep -q 'defineMiddlewares' "$middleware"
          grep -q 'archive_guard_unavailable' "$middleware"
          grep -q 'product_archived' "$middleware"
          grep -q 'placement-taxonomy' "$middleware"
          if grep -q 'admin\\/studio\\/archive' "$middleware"; then
            echo 'Archive/restore endpoint must remain exempt from the archived-write middleware.' >&2
            exit 1
          fi

          grep -q 'studioProductIsArchived' "$lifecycle"
          grep -q 'product_archived' "$lifecycle"
          grep -q "coquette_studio_archived !== 'true'" apps/studio/api/studio/drafts.js
          grep -q "coquette_studio_archived === 'true'" apps/studio/api/studio/product-draft-update.js

          grep -q 'stale_archive_plan' "$contract"
          grep -q 'record.status, "published"' "$contract"
          grep -q 'record.status, "draft"' "$contract"
          grep -q 'coquette_studio_archived' "$contract"
          grep -q 'readStudioLifecycleState' "$contract"
          grep -q 'salesChannelId' "$contract"
          grep -q 'preserve-me' "$contract"

          grep -q '/api/studio/archive-state' "$client"
          grep -q '/api/studio/archive-plan' "$client"
          grep -q '/api/studio/archive-apply' "$client"
          grep -q 'archive_hash' "$client"
          grep -q 'It never republishes automatically' "$client"

          if grep -R -n -E 'deleteProduct|deleteProducts|deleteProductsWorkflow|removeProducts|removeProduct' \
            apps/backend/src/api/admin/studio/archive apps/backend/src/lib/studio-archive.ts apps/backend/src/workflows/apply-studio-archive.ts apps/backend/src/scripts/studio-archive-contract.ts; then
            echo 'Archive policy must not delete catalogue records.' >&2
            exit 1
          fi

  runtime-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: coquette_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d coquette_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/coquette_ci
      REDIS_URL: redis://localhost:6379
      STORE_CORS: http://localhost:8000
      ADMIN_CORS: http://localhost:9000
      AUTH_CORS: http://localhost:8000,http://localhost:9000
      JWT_SECRET: ci-build-only-secret
      COOKIE_SECRET: ci-build-only-secret
      MEDUSA_BACKEND_URL: http://localhost:9000
      MEDUSA_WORKER_MODE: server
      DISABLE_MEDUSA_ADMIN: "false"
      PAYPAL_CLIENT_ID: ci-paypal-client
      PAYPAL_CLIENT_SECRET: ci-paypal-secret
      PAYPAL_ENVIRONMENT: sandbox
      PAYPAL_AUTO_CAPTURE: "false"
      KLARNA_USERNAME: ci-klarna-user
      KLARNA_PASSWORD: ci-klarna-password
      KLARNA_CALLBACK_BASE_URL: https://coquette-ci.example
      KLARNA_CALLBACK_SECRET: ci-klarna-callback-secret
      KLARNA_ENVIRONMENT: playground
      KLARNA_API_REGION: eu
      KLARNA_PURCHASE_COUNTRY: GR
      KLARNA_LOCALE: el-GR
      COQUETTE_STANDARD_SHIPPING_EUR: "4.90"

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.1
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check backend
        run: pnpm --filter @coquette/backend exec tsc --noEmit

      - name: Enforce backend lint rules
        run: pnpm --filter @coquette/backend lint

      - name: Run Medusa migrations
        run: pnpm --filter @coquette/backend db:migrate

      - name: Bootstrap canonical staging commerce defaults
        run: pnpm --filter @coquette/backend staging:bootstrap

      - name: Validate guarded archive and restore contract
        run: pnpm --filter @coquette/backend exec medusa exec ./src/scripts/studio-archive-contract.ts
