name: COQUETTE Studio CI

on:
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"
    paths:
      - "apps/studio/**"
      - "apps/backend/src/api/admin/studio/media/**"
      - "apps/backend/src/api/admin/studio/variants/**"
      - "apps/backend/src/lib/studio-media.ts"
      - "apps/backend/src/lib/studio-variants.ts"
      - "apps/backend/src/workflows/generate-studio-product-variants.ts"
      - "docs/studio/**"
      - ".github/workflows/studio.yml"
  pull_request:
    branches:
      - main
    paths:
      - "apps/studio/**"
      - "apps/backend/src/api/admin/studio/media/**"
      - "apps/backend/src/api/admin/studio/variants/**"
      - "apps/backend/src/lib/studio-media.ts"
      - "apps/backend/src/lib/studio-variants.ts"
      - "apps/backend/src/workflows/generate-studio-product-variants.ts"
      - "docs/studio/**"
      - ".github/workflows/studio.yml"

permissions:
  contents: read

concurrency:
  group: coquette-studio-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0

      - name: Validate Studio JavaScript syntax
        run: |
          node --check apps/studio/login.js
          node --check apps/studio/studio.js
          node --check apps/studio/new-piece.js
          node --check apps/studio/new-piece-media.js
          node --check apps/studio/new-piece-variants.js
          node --check apps/studio/public/new-piece-variants.js
          node --check apps/studio/lib/medusa.js
          node --check apps/studio/api/auth/login.js
          node --check apps/studio/api/auth/me.js
          node --check apps/studio/api/auth/logout.js
          node --check apps/studio/api/studio/summary.js
          node --check apps/studio/api/studio/products.js
          node --check apps/studio/api/studio/product.js
          node --check apps/studio/api/studio/orders.js
          node --check apps/studio/api/studio/order.js
          node --check apps/studio/api/studio/product-drafts.js
          node --check apps/studio/api/studio/product-draft-update.js
          node --check apps/studio/api/studio/drafts.js
          node --check apps/studio/api/studio/media-presign.js
          node --check apps/studio/api/studio/media-attach.js
          node --check apps/studio/api/studio/media-order.js
          node --check apps/studio/api/studio/variant-plan.js
          node --check apps/studio/api/studio/variant-generate.js

      - name: Validate Vercel configuration
        run: node -e "JSON.parse(require('fs').readFileSync('apps/studio/vercel.json','utf8'))"

      - name: Enforce Studio session security contract
        shell: bash
        run: |
          set -euo pipefail
          test -s apps/studio/assets/coquette-logo-transparent.png
          grep -q '/auth/user/emailpass' apps/studio/api/auth/login.js
          grep -q '/admin/users/me' apps/studio/api/auth/login.js
          grep -q 'HttpOnly' apps/studio/lib/medusa.js
          grep -q 'SameSite=Lax' apps/studio/lib/medusa.js
          grep -q 'noindex,nofollow,noarchive' apps/studio/index.html
          grep -q 'noindex,nofollow,noarchive' apps/studio/studio.html
          if grep -R -n -E 'localStorage|sessionStorage' apps/studio/*.js apps/studio/api apps/studio/lib; then
            echo 'Browser token/session storage is forbidden in COQUETTE Studio.' >&2
            exit 1
          fi
          if grep -R -n -E 'Bearer|authorization' apps/studio/login.js apps/studio/studio.js apps/studio/new-piece.js apps/studio/new-piece-media.js apps/studio/new-piece-variants.js; then
            echo 'Browser code must not receive or construct Medusa bearer tokens.' >&2
            exit 1
          fi

      - name: Enforce guarded product creation boundary
        shell: bash
        run: |
          set -euo pipefail
          grep -q "req.method !== 'POST'" apps/studio/api/studio/product-drafts.js
          grep -q "status: 'draft'" apps/studio/api/studio/product-drafts.js
          grep -q "shipping_profile_id" apps/studio/api/studio/product-drafts.js
          grep -q "coquette_studio_origin" apps/studio/api/studio/product-drafts.js
          if grep -n -E "status:[[:space:]]*['\"]published['\"]|inventory_quantity|sales_channels|prices:" apps/studio/api/studio/product-drafts.js; then
            echo 'Quick Draft must remain unpublished and must not mutate price, inventory or sales-channel visibility.' >&2
            exit 1
          fi
          count=$(grep -R -l "admin(req, '/admin/products'.*method: 'POST'\|admin(req, '/admin/products'" apps/studio/api/studio | wc -l)
          test "$count" -eq 1

      - name: Enforce guided draft autosave boundary
        shell: bash
        run: |
          set -euo pipefail
          file=apps/studio/api/studio/product-draft-update.js
          grep -q "current.status !== 'draft'" "$file"
          grep -q "coquette_studio_origin" "$file"
          grep -q "expected_updated_at" "$file"
          grep -q "stale_draft" "$file"
          grep -q "coquette_studio_flow = 'guided_new_piece'" "$file"
          grep -q "product.status !== 'draft'" "$file"
          grep -q "coquette_studio_variants_generated === 'true'" "$file"
          grep -q "variant_blueprint_locked" "$file"
          grep -q "LOCKED_CHOICE_METADATA" "$file"
          if grep -n -E "status:[[:space:]]*['\"]published['\"]|inventory_quantity|inventory_items|sales_channels|prices:|payment_status|fulfillment_status" "$file"; then
            echo 'Guided autosave must remain descriptive/editorial and unpublished.' >&2
            exit 1
          fi
          grep -q '/api/studio/product-draft-update' apps/studio/new-piece.js
          grep -q 'expected_updated_at' apps/studio/new-piece.js
          grep -q '/api/studio/drafts' apps/studio/new-piece.js
          if grep -n -E "published|inventory_quantity|sales_channels|prices:" apps/studio/new-piece.js | grep -v -E "unpublished|Unpublished|Publish|publication|published product|price|inventory|sales-channel"; then
            echo 'Review guided New Piece client for an accidental commerce mutation surface.' >&2
            exit 1
          fi

      - name: Enforce managed product media boundary
        shell: bash
        run: |
          set -euo pipefail
          guard=apps/backend/src/lib/studio-media.ts
          presign=apps/backend/src/api/admin/studio/media/presign/route.ts
          attach=apps/backend/src/api/admin/studio/media/attach/route.ts
          order=apps/backend/src/api/admin/studio/media/order/route.ts
          client=apps/studio/new-piece-media.js

          grep -q 'product.status !== "draft"' "$guard"
          grep -q 'coquette_studio_origin !== "quick_draft"' "$guard"
          grep -q 'STUDIO_MAX_IMAGE_BYTES = 12 \* 1024 \* 1024' "$guard"
          grep -q 'STUDIO_MAX_PRODUCT_IMAGES = 20' "$guard"
          grep -q 'studio/products/${productId}/' "$guard"
          grep -q 'getPresignedUploadUrl' "$presign"
          grep -q 'expiresIn: 300' "$presign"
          grep -q 'access: "public"' "$presign"
          grep -q 'isStudioManagedMediaKey' "$attach"
          grep -q 'method: "HEAD"' "$attach"
          grep -q 'STUDIO_MAX_IMAGE_BYTES' "$attach"
          grep -q 'expected_updated_at' "$attach"
          grep -q 'updateProductsWorkflow' "$attach"
          grep -q 'currentSet.has(url)' "$order"
          grep -q 'New image URLs cannot be introduced through the ordering route' "$order"
          grep -q 'expected_updated_at' "$order"
          grep -q 'updateProductsWorkflow' "$order"
          grep -q '/api/studio/media-presign' "$client"
          grep -q '/api/studio/media-attach' "$client"
          grep -q '/api/studio/media-order' "$client"
          grep -q "credentials: 'omit'" "$client"
          grep -q 'No external image URL field exists' "$client"
          grep -q '/new-piece-media.css' apps/studio/studio.html
          grep -q '/new-piece-media.js' apps/studio/studio.html
          test -s apps/studio/new-piece-media.css

          if grep -n -E 'image_url|external_url|remote_url|hotlink' "$client"; then
            echo 'Managed New Piece media must not expose an arbitrary external URL input.' >&2
            exit 1
          fi

      - name: Enforce guarded variant generation boundary
        shell: bash
        run: |
          set -euo pipefail
          guard=apps/backend/src/lib/studio-variants.ts
          plan=apps/backend/src/api/admin/studio/variants/route.ts
          generate=apps/backend/src/api/admin/studio/variants/generate/route.ts
          workflow=apps/backend/src/workflows/generate-studio-product-variants.ts
          client=apps/studio/new-piece-variants.js
          autosave=apps/studio/api/studio/product-draft-update.js

          grep -q 'product.status !== "draft"' "$guard"
          grep -q 'coquette_studio_origin !== "quick_draft"' "$guard"
          grep -q 'STUDIO_MAX_VARIANTS = 120' "$guard"
          grep -q 'createHash("sha256")' "$guard"
          grep -q 'studioVariantGraphExists' "$plan"
          grep -q 'Modules.LOCKING' "$generate"
          grep -q 'coquette-studio-variants:${productId}' "$generate"
          grep -q 'expected_updated_at' "$generate"
          grep -q 'blueprint_hash' "$generate"
          grep -q 'stale_blueprint' "$generate"
          grep -q 'studioVariantGraphExists' "$generate"
          grep -q 'manage_inventory: false' "$generate"
          grep -q 'allow_backorder: false' "$generate"
          grep -q 'createAndLinkProductOptionsToProductWorkflow' "$workflow"
          grep -q 'createProductVariantsWorkflow' "$workflow"
          grep -q "coquette_studio_variants_generated === 'true'" "$autosave"
          grep -q 'variant_blueprint_locked' "$autosave"
          grep -q '/api/studio/variant-plan' "$client"
          grep -q '/api/studio/variant-generate' "$client"
          grep -q 'expected_updated_at' "$client"
          grep -q 'blueprint_hash' "$client"
          grep -q 'Review saved choices' "$client"
          grep -q 'Build choices' "$client"
          grep -q '/new-piece-variants.css' apps/studio/studio.html
          grep -q '/new-piece-variants.js' apps/studio/studio.html
          grep -q '/new-piece-variants.css' apps/studio/public/studio.html
          grep -q '/new-piece-variants.js' apps/studio/public/studio.html
          test -s apps/studio/new-piece-variants.css
          test -s apps/studio/new-piece-variants.js
          cmp -s apps/studio/new-piece-variants.js apps/studio/public/new-piece-variants.js
          cmp -s apps/studio/new-piece-variants.css apps/studio/public/new-piece-variants.css
          cmp -s apps/studio/studio.html apps/studio/public/studio.html

          if grep -n -E 'sales_channels|inventory_quantity|inventory_items|status:[[:space:]]*["'"']published["'"']' "$generate" "$workflow"; then
            echo 'Variant generation must not publish, assign inventory or change sales-channel visibility.' >&2
            exit 1
          fi
          if grep -n -E 'amount:[[:space:]]*[0-9]|prices:[[:space:]]*\[' "$generate" "$workflow"; then
            echo 'Variant generation must not assign or infer monetary amounts.' >&2
            exit 1
          fi

      - name: Validate production Studio surfaces
        run: |
          grep -q 'COQUETTE Assistant' apps/studio/studio.html
          grep -q 'product-grid' apps/studio/studio.html
          grep -q 'Order Story' apps/studio/studio.html
          grep -q 'workspace-drawer' apps/studio/studio.html
          grep -q 'guided-new-piece' apps/studio/studio.html
          grep -q 'new-piece-layer' apps/studio/studio.html
          grep -q "stepIntro(8, 'Review it like a stylist.'" apps/studio/new-piece.js
          grep -q 'Publish — guarded activation not enabled yet' apps/studio/new-piece.js
          grep -q 'Ένα κορίτσι πρέπει να είναι δύο πράγματα' apps/studio/index.html
