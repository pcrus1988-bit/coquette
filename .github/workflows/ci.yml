name: COQUETTE CI

on:
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate local Docker Compose
        run: docker compose -f infra/local/docker-compose.yml config --quiet

      - name: Type-check backend
        run: pnpm --filter @coquette/backend exec tsc --noEmit

      - name: Validate Magento migration contract
        run: pnpm --filter @coquette/backend migration:contract

      - name: Build Medusa production artifact
        env:
          NODE_ENV: production
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/coquette_ci
          REDIS_URL: redis://localhost:6379
          STORE_CORS: http://localhost:8000
          ADMIN_CORS: http://localhost:9000
          AUTH_CORS: http://localhost:8000,http://localhost:9000
          JWT_SECRET: ci-build-only-secret
          COOKIE_SECRET: ci-build-only-secret
          MEDUSA_BACKEND_URL: http://localhost:9000
          MEDUSA_WORKER_MODE: server
          DISABLE_MEDUSA_ADMIN: "false"
        run: |
          pnpm --filter @coquette/backend build
          test -f apps/backend/.medusa/server/medusa-config.js
          test -f apps/backend/.medusa/server/package.json

      - name: Build storefront
        run: pnpm --filter @coquette/storefront build
