name: COQUETTE CI

on:
  push:
    branches:
      - main
      - staging
      - "feature/**"
      - "fix/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: coquette-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: coquette_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d coquette_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/coquette_ci
      REDIS_URL: redis://localhost:6379
      STORE_CORS: http://localhost:8000
      ADMIN_CORS: http://localhost:9000
      AUTH_CORS: http://localhost:8000,http://localhost:9000
      JWT_SECRET: ci-build-only-secret
      COOKIE_SECRET: ci-build-only-secret
      MEDUSA_BACKEND_URL: http://localhost:9000
      MEDUSA_WORKER_MODE: server
      DISABLE_MEDUSA_ADMIN: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate local Docker Compose
        run: docker compose -f infra/local/docker-compose.yml config --quiet

      - name: Type-check backend
        run: pnpm --filter @coquette/backend exec tsc --noEmit

      - name: Enforce Medusa lint rules
        run: pnpm --filter @coquette/backend lint

      - name: Validate storefront reconstruction migration contract
        run: pnpm --filter @coquette/backend migration:contract

      - name: Validate storefront capture parser contract
        run: pnpm --filter @coquette/backend storefront:capture:contract

      - name: Validate operator direct-capture evidence package integrity
        run: pnpm --filter @coquette/backend capture-evidence-package:contract

      - name: Validate single-file operator capture handoff
        run: pnpm --filter @coquette/backend capture-handoff:contract

      - name: Validate verified handoff reconciliation intake
        run: pnpm --filter @coquette/backend capture-handoff:intake:contract

      - name: Validate dependency provisioning evidence
        run: pnpm --filter @coquette/backend dependency-provisioning:evidence:contract

      - name: Validate indexed recovery evidence contract
        run: pnpm --filter @coquette/backend indexed-recovery:contract

      - name: Validate recovery candidate safety contract
        run: pnpm --filter @coquette/backend recovery-candidates:contract

      - name: Generate current indexed recovery candidates
        run: pnpm --filter @coquette/backend indexed-recovery:candidates > /tmp/coquette-indexed-recovery-candidates.json

      - name: Validate capture ingestion and URL universe contract
        run: pnpm --filter @coquette/backend capture-ingestion:contract

      - name: Validate public product structure evidence
        run: pnpm --filter @coquette/backend product-structure:contract

      - name: Validate archive-native product structure reconstruction
        run: pnpm --filter @coquette/backend archived-product-structure:contract

      - name: Validate deterministic product import plan
        run: pnpm --filter @coquette/backend import-plan:contract

      - name: Validate deterministic price reconstruction plan
        run: pnpm --filter @coquette/backend price-plan:contract

      - name: Validate deterministic inventory evidence plan
        run: pnpm --filter @coquette/backend inventory-plan:contract

      - name: Validate reconstruction review decision safety
        run: pnpm --filter @coquette/backend review-decisions:contract

      - name: Validate review evidence-selection application
        run: pnpm --filter @coquette/backend review-application:contract

      - name: Validate checksum-bound migration input reconciliation
        run: pnpm --filter @coquette/backend migration-input-reconciliation:contract

      - name: Validate deterministic dependency mapping reconciliation
        run: pnpm --filter @coquette/backend dependency-mapping:contract

      - name: Validate pinned staging migration input boundary
        run: pnpm --filter @coquette/backend staging-migration-input:contract

      - name: Validate pinned staging dependency-plan boundary
        run: pnpm --filter @coquette/backend staging-dependency-input:contract

      - name: Validate staging structural product execution preflight
        run: pnpm --filter @coquette/backend staging-product-execution:contract

      - name: Validate guarded staging price execution preflight
        run: pnpm --filter @coquette/backend staging-price-execution:contract

      - name: Run Medusa migrations on clean PostgreSQL
        run: pnpm --filter @coquette/backend db:migrate

      - name: Validate COQUETTE Admin CRUD contract
        run: pnpm --filter @coquette/backend admin:crud:contract

      - name: Validate payment provider registration paths
        env:
          PAYPAL_CLIENT_ID: ci-paypal-client
          PAYPAL_CLIENT_SECRET: ci-paypal-secret
          PAYPAL_ENVIRONMENT: sandbox
          PAYPAL_AUTO_CAPTURE: "false"
          KLARNA_USERNAME: ci-klarna-user
          KLARNA_PASSWORD: ci-klarna-password
          KLARNA_CALLBACK_BASE_URL: https://coquette-ci.example
          KLARNA_CALLBACK_SECRET: ci-klarna-callback-secret
          KLARNA_ENVIRONMENT: playground
          KLARNA_API_REGION: eu
          KLARNA_PURCHASE_COUNTRY: GR
          KLARNA_LOCALE: el-GR
        run: pnpm --filter @coquette/backend db:migrate

      - name: Validate idempotent staging commerce bootstrap
        env:
          PAYPAL_CLIENT_ID: ci-paypal-client
          PAYPAL_CLIENT_SECRET: ci-paypal-secret
          PAYPAL_ENVIRONMENT: sandbox
          PAYPAL_AUTO_CAPTURE: "false"
          KLARNA_USERNAME: ci-klarna-user
          KLARNA_PASSWORD: ci-klarna-password
          KLARNA_CALLBACK_BASE_URL: https://coquette-ci.example
          KLARNA_CALLBACK_SECRET: ci-klarna-callback-secret
          KLARNA_ENVIRONMENT: playground
          KLARNA_API_REGION: eu
          KLARNA_PURCHASE_COUNTRY: GR
          KLARNA_LOCALE: el-GR
          COQUETTE_STANDARD_SHIPPING_EUR: "4.90"
        run: |
          pnpm --filter @coquette/backend staging:bootstrap
          pnpm --filter @coquette/backend staging:bootstrap

      - name: Validate Sale pricing graph contract
        run: pnpm --filter @coquette/backend sale:contract

      - name: Validate clean-database verified dependency-plan staging structural product import idempotency
        run: pnpm --filter @coquette/backend staging-product-import:contract

      - name: Validate clean-database reconciled-bundle staging price import idempotency and updates
        run: pnpm --filter @coquette/backend staging-price-import:contract

      - name: Validate clean-database Studio guarded pricing execution
        run: pnpm --filter @coquette/backend exec medusa exec ./src/scripts/studio-pricing-contract.ts

      - name: Validate clean-database Studio guarded variant identifiers
        run: pnpm --filter @coquette/backend exec medusa exec ./src/scripts/studio-variant-identifiers-contract.ts

      - name: Build deployable Medusa production artifact through Railway wrapper
        env:
          NODE_ENV: production
        run: |
          pnpm railway-build-backend
          test -f apps/backend/.medusa/server/medusa-config.js
          test -f apps/backend/.medusa/server/package.json
          test -d apps/backend/.medusa/server/node_modules

      - name: Smoke-test Railway production runtime
        env:
          NODE_ENV: production
          HOST: 0.0.0.0
          PORT: "9000"
        run: |
          set -euo pipefail
          pnpm railway-predeploy-backend
          pnpm railway-start-backend > /tmp/coquette-medusa-runtime.log 2>&1 &
          server_pid=$!
          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          healthy=0
          for attempt in $(seq 1 45); do
            if curl --fail --silent --show-error http://127.0.0.1:9000/health > /tmp/coquette-health.txt 2>/tmp/coquette-health.err; then
              healthy=1
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo "Medusa production runtime exited before becoming healthy" >&2
              cat /tmp/coquette-medusa-runtime.log >&2
              exit 1
            fi
            sleep 2
          done

          if [ "$healthy" -ne 1 ]; then
            echo "Medusa production runtime did not reach /health" >&2
            cat /tmp/coquette-health.err >&2 || true
            cat /tmp/coquette-medusa-runtime.log >&2
            exit 1
          fi

          grep -q 'OK' /tmp/coquette-health.txt
          echo "Railway-equivalent production runtime reached /health successfully"

      - name: Build storefront
        run: pnpm --filter @coquette/storefront build
