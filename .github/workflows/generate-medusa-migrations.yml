name: Generate Medusa module migrations

on:
  push:
    branches:
      - feature/supabase-medusa-foundation

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      STORE_CORS: http://localhost:8000
      ADMIN_CORS: http://localhost:9000
      AUTH_CORS: http://localhost:8000,http://localhost:9000
      JWT_SECRET: ci-only-not-a-production-secret
      COOKIE_SECRET: ci-only-not-a-production-secret
      MEDUSA_WORKER_MODE: shared
      DISABLE_MEDUSA_ADMIN: "false"

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/supabase-medusa-foundation

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate custom module migrations
        run: pnpm --filter @coquette/backend exec medusa db:generate brand content

      - name: Commit generated migrations when changed
        shell: bash
        run: |
          if git diff --quiet -- apps/backend/src/modules; then
            echo "No migration changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/backend/src/modules/*/migrations
          git commit -m "db: generate brand and content migrations"
          git push origin HEAD:feature/supabase-medusa-foundation
