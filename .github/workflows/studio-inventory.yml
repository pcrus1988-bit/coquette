name: COQUETTE Studio Inventory CI

on:
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"
    paths:
      - "apps/studio/new-piece-inventory.js"
      - "apps/studio/new-piece-inventory.css"
      - "apps/studio/public/new-piece-inventory.js"
      - "apps/studio/public/new-piece-inventory.css"
      - "apps/studio/studio.html"
      - "apps/studio/public/studio.html"
      - "apps/studio/api/studio/inventory-*.js"
      - "apps/backend/src/api/admin/studio/inventory/**"
      - "apps/backend/src/lib/studio-inventory.ts"
      - "apps/backend/src/workflows/apply-studio-inventory.ts"
      - "apps/backend/src/scripts/studio-inventory-contract.ts"
      - ".github/workflows/studio-inventory.yml"
  pull_request:
    branches:
      - main
    paths:
      - "apps/studio/new-piece-inventory.js"
      - "apps/studio/new-piece-inventory.css"
      - "apps/studio/public/new-piece-inventory.js"
      - "apps/studio/public/new-piece-inventory.css"
      - "apps/studio/studio.html"
      - "apps/studio/public/studio.html"
      - "apps/studio/api/studio/inventory-*.js"
      - "apps/backend/src/api/admin/studio/inventory/**"
      - "apps/backend/src/lib/studio-inventory.ts"
      - "apps/backend/src/workflows/apply-studio-inventory.ts"
      - "apps/backend/src/scripts/studio-inventory-contract.ts"
      - ".github/workflows/studio-inventory.yml"

permissions:
  contents: read

concurrency:
  group: coquette-studio-inventory-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0

      - name: Validate inventory JavaScript syntax
        run: |
          node --check apps/studio/new-piece-inventory.js
          node --check apps/studio/public/new-piece-inventory.js
          node --check apps/studio/api/studio/inventory-state.js
          node --check apps/studio/api/studio/inventory-plan.js
          node --check apps/studio/api/studio/inventory-apply.js

      - name: Enforce production asset parity
        shell: bash
        run: |
          set -euo pipefail
          test -s apps/studio/new-piece-inventory.js
          test -s apps/studio/new-piece-inventory.css
          cmp -s apps/studio/new-piece-inventory.js apps/studio/public/new-piece-inventory.js
          cmp -s apps/studio/new-piece-inventory.css apps/studio/public/new-piece-inventory.css
          cmp -s apps/studio/studio.html apps/studio/public/studio.html
          grep -q '/new-piece-inventory.css' apps/studio/studio.html
          grep -q '/new-piece-inventory.js' apps/studio/studio.html
          grep -q '/new-piece-inventory.css' apps/studio/public/studio.html
          grep -q '/new-piece-inventory.js' apps/studio/public/studio.html

      - name: Enforce guarded inventory review and write boundary
        shell: bash
        run: |
          set -euo pipefail
          domain=apps/backend/src/lib/studio-inventory.ts
          workflow=apps/backend/src/workflows/apply-studio-inventory.ts
          contract=apps/backend/src/scripts/studio-inventory-contract.ts
          plan=apps/backend/src/api/admin/studio/inventory/plan/route.ts
          apply=apps/backend/src/api/admin/studio/inventory/apply/route.ts
          client=apps/studio/new-piece-inventory.js

          grep -q 'STUDIO_INVENTORY_LOCATION_NAME = "COQUETTE Greece"' "$domain"
          grep -q 'createHash("sha256")' "$domain"
          grep -q 'Every current variant must have exactly one explicit stock row' "$domain"
          grep -q 'Multi-location inventory is outside this guarded workflow' "$domain"
          grep -q 'Inventory kits require a separate reviewed workflow' "$domain"
          grep -q 'Reservations are never rewritten by Studio' "$domain"
          grep -q 'stale_inventory_plan' "$domain"
          grep -q 'applyStudioInventoryWorkflow' "$domain"

          grep -q 'createInventoryItemsWorkflow' "$workflow"
          grep -q 'createInventoryLevelsWorkflow' "$workflow"
          grep -q 'createLinksWorkflow' "$workflow"
          grep -q 'updateInventoryLevelsWorkflow' "$workflow"
          grep -q 'updateProductVariantsWorkflow' "$workflow"
          grep -q 'manage_inventory: true' "$workflow"
          grep -q 'allow_backorder: false' "$workflow"

          grep -q 'buildStudioInventoryPlan' "$plan"
          grep -q 'expected_updated_at' "$plan"
          grep -q 'Modules.LOCKING' "$apply"
          grep -q 'coquette-studio-inventory' "$apply"
          grep -q 'inventory_hash' "$apply"
          grep -q 'applyStudioInventoryPlan' "$apply"

          grep -q '/api/studio/inventory-state' "$client"
          grep -q '/api/studio/inventory-plan' "$client"
          grep -q '/api/studio/inventory-apply' "$client"
          grep -q 'Apply reviewed stock' "$client"
          grep -q 'Reservations read-only' "$client"
          grep -q 'Backorders stay off' "$client"
          grep -q 'inventory_hash' "$client"
          grep -q 'expected_updated_at' "$client"

          grep -q 'setup_tracking' "$contract"
          grep -q 'change_count, 0' "$contract"
          grep -q 'stale_inventory_plan' "$contract"
          grep -q 'status, "draft"' "$contract"
          grep -q 'manage_inventory === true' "$contract"
          grep -q 'allow_backorder === false' "$contract"

          if grep -R -n -E 'sales_channels|sales_channel_id|price_set|pricing_hash|identifier_hash' \
            apps/backend/src/api/admin/studio/inventory apps/backend/src/lib/studio-inventory.ts apps/backend/src/workflows/apply-studio-inventory.ts apps/studio/new-piece-inventory.js; then
            echo 'Studio inventory must not mutate sales-channel visibility, pricing or identifiers.' >&2
            exit 1
          fi

          if grep -R -n -E "status:[[:space:]]*\"published\"|status:[[:space:]]*'published'" \
            apps/backend/src/api/admin/studio/inventory apps/backend/src/lib/studio-inventory.ts apps/backend/src/workflows/apply-studio-inventory.ts apps/studio/new-piece-inventory.js; then
            echo 'Studio inventory must not publish products.' >&2
            exit 1
          fi

          if grep -R -n -E 'localStorage|sessionStorage|Bearer|authorization' apps/studio/new-piece-inventory.js; then
            echo 'Inventory browser code must not hold Medusa credentials or browser token state.' >&2
            exit 1
          fi

  runtime-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: coquette_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d coquette_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/coquette_ci
      REDIS_URL: redis://localhost:6379
      STORE_CORS: http://localhost:8000
      ADMIN_CORS: http://localhost:9000
      AUTH_CORS: http://localhost:8000,http://localhost:9000
      JWT_SECRET: ci-build-only-secret
      COOKIE_SECRET: ci-build-only-secret
      MEDUSA_BACKEND_URL: http://localhost:9000
      MEDUSA_WORKER_MODE: server
      DISABLE_MEDUSA_ADMIN: "false"
      PAYPAL_CLIENT_ID: ci-paypal-client
      PAYPAL_CLIENT_SECRET: ci-paypal-secret
      PAYPAL_ENVIRONMENT: sandbox
      PAYPAL_AUTO_CAPTURE: "false"
      KLARNA_USERNAME: ci-klarna-user
      KLARNA_PASSWORD: ci-klarna-password
      KLARNA_CALLBACK_BASE_URL: https://coquette-ci.example
      KLARNA_CALLBACK_SECRET: ci-klarna-callback-secret
      KLARNA_ENVIRONMENT: playground
      KLARNA_API_REGION: eu
      KLARNA_PURCHASE_COUNTRY: GR
      KLARNA_LOCALE: el-GR
      COQUETTE_STANDARD_SHIPPING_EUR: "4.90"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check inventory backend
        run: pnpm --filter @coquette/backend exec tsc --noEmit

      - name: Run Medusa migrations
        run: pnpm --filter @coquette/backend db:migrate

      - name: Bootstrap canonical staging commerce defaults
        run: pnpm --filter @coquette/backend staging:bootstrap

      - name: Validate guarded single-location inventory contract
        run: pnpm --filter @coquette/backend exec medusa exec ./src/scripts/studio-inventory-contract.ts
