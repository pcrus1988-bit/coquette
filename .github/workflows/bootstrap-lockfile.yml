name: Bootstrap pnpm lockfile

on:
  push:
    branches:
      - feature/core-scaffold

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/core-scaffold

      - name: Check lockfile state
        id: state
        shell: bash
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "missing=false" >> "$GITHUB_OUTPUT"
          else
            echo "missing=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup pnpm
        if: steps.state.outputs.missing == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.1
          run_install: false

      - name: Setup Node.js
        if: steps.state.outputs.missing == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0

      - name: Generate lockfile
        if: steps.state.outputs.missing == 'true'
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Commit lockfile
        if: steps.state.outputs.missing == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore: commit generated pnpm lockfile"
          git push origin HEAD:feature/core-scaffold
